<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Azerfolio Mockup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marcellus&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="devbar">
  <strong>Azerfolio mockup</strong>
  <span>Controller:</span>
  <kbd>Arrows</kbd> D-pad <kbd>Enter</kbd> A <kbd>Esc</kbd> B <kbd>Q</kbd>/<kbd>E</kbd> LB/RB <kbd>Y</kbd> <kbd>X</kbd> <kbd>PgUp</kbd>/<kbd>PgDn</kbd> LT/RT
  <span class="sep"></span>
  <label>Data <select id="scenario">
    <option value="today">Gideon today (7/12 Elwynn)</option>
    <option value="almost">Gideon, 1 area left</option>
    <option value="veteran">Veteran (several zones done)</option>
    <option value="fresh">Brand-new character</option>
  </select></label>
  <button id="simulate">Simulate discovery</button>
  <label>Quests <select id="questMode"></select></label>
  <label>Celebrate <select id="celebrateSel">
    <option value="">choose…</option>
    <option value="explore">Area finished: Explored</option>
    <option value="quests">Every quest done</option>
    <option value="flights">Every flight path found</option>
    <option value="claim">Zone claimed</option>
    <option value="alert">Window closed: on-screen alert</option>
  </select></label>
  <label>Look <select id="lookSel"><option>Alliance</option><option>Horde</option></select></label>
  <label>Rep bar <select id="repBarSel"><option value="equal">Notched, equal steps</option><option value="true">Notched, true scale</option><option value="ladder">Ladder (round 2)</option></select></label>
  <label>Strip <select id="stripSel"><option value="cloth">Tinted cloth</option><option value="enamel">Tinted enamel</option><option value="line">Top line (round 1)</option></select></label>
  <label>Class <select id="classSel"><option value="data">From the scenario</option><option value="all">Every quest done</option><option value="unknown">Completion not known</option></select></label>
  <label><input type="checkbox" id="claimPreview"> Preview claimed</label>
  <span class="right">
    <label><input type="checkbox" id="wideToggle"> Wide window (ultrawide)</label>
    <label><input type="checkbox" id="scaleToggle" checked> Fit to screen</label>
  </span>
</div>

<div class="stage" id="stage">
  <div class="window" id="window">
    <!-- Native Forever chrome (see DESIGN.md): PortraitFrameTemplate frame with portrait ring, title band
         and close button; the controller-focus glow; right-side tabs; a legend box below the frame. -->
    <div class="titlebar">
      <div class="portrait"><svg viewBox="0 0 64 64" aria-hidden="true"><defs><radialGradient id="pg" cx="50%" cy="40%"><stop offset="0" stop-color="#f6d6a8"/><stop offset="1" stop-color="#8a5a33"/></radialGradient></defs><circle cx="32" cy="32" r="32" fill="url(#pg)"/><path d="M32 12 L48 20 V34 C48 44 40 50 32 54 C24 50 16 44 16 34 V20 Z" fill="#f58cba" stroke="#5b2a3e" stroke-width="2"/><path d="M32 20 V46 M22 30 H42" stroke="#fff4d6" stroke-width="4" stroke-linecap="round"/></svg></div>
      <div class="title" id="winTitle">Azerfolio</div>
      <button class="close focusable" id="closeBtn" data-tip="<b>Close</b>Close Azerfolio." aria-label="Close">&#x2715;</button>
    </div>
    <header class="charheader">
      <div class="charinfo">
        <div class="charname" id="charName"></div>
        <div class="charline" id="charLine"></div>
      </div>
      <div class="xp"><div class="xpfill" id="xpFill"></div><span id="xpText"></span></div>
      <div class="charzone" id="charZone"></div>
    </header>

    <main class="content" id="content"></main>

    <nav class="sidetabs" id="tabs">
      <span class="glyph shoulder">LB</span>
      <button class="tab focusable" data-tab="overview" aria-label="Overview" data-tip="<b>Overview</b>Your progress at a glance.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><rect x="5" y="7" width="30" height="26" rx="2" fill="#6b3d1e" stroke="#2a1608" stroke-width="2"/><path d="M20 10 C14 8 10 9 8 10 V30 C10 29 14 28 20 30 C26 28 30 29 32 30 V10 C30 9 26 8 20 10 Z" fill="#ead7ae" stroke="#5a3f24" stroke-width="1.5"/><path d="M20 10 V30" stroke="#8a6d2f" stroke-width="1.5"/><path d="M11 15 H17 M11 19 H17 M11 23 H16 M23 15 H29 M23 19 H29 M23 23 H28" stroke="#8a6d2f" stroke-width="1.2"/></svg>
      </button>
      <button class="tab focusable" data-tab="zones" aria-label="Zones" data-tip="<b>Zones</b>Every zone and its exploration.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M6 10 L15 7 L25 10 L34 7 V30 L25 33 L15 30 L6 33 Z" fill="#d9c495" stroke="#4a3218" stroke-width="2" stroke-linejoin="round"/><path d="M15 7 V30 M25 10 V33" stroke="#8a6d2f" stroke-width="1.5"/><path d="M9 25 C13 20 17 24 21 18 C24 14 28 17 31 13" stroke="#9c4f17" stroke-width="2" fill="none" stroke-dasharray="3 2"/><circle cx="31" cy="13" r="2.5" fill="#c0392b"/></svg>
      </button>
      <button class="tab focusable" data-tab="reputation" aria-label="Reputation" data-tip="<b>Reputation</b>Every faction and how to raise it.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 7 H32 L30 16 L33 33 L20 29 L7 33 L10 16 Z" fill="#7a1f1f" stroke="#2a0d08" stroke-width="2" stroke-linejoin="round"/><path d="M8 7 H32 L31 11 H9 Z" fill="#c9a24a" stroke="#4a3218" stroke-width="1"/><path d="M20 14 L25 19 L20 25 L15 19 Z" fill="#ffd24d" stroke="#6b4a10" stroke-width="1.2"/><path d="M11 30 L20 27 L29 30" stroke="#c9a24a" stroke-width="1.5" fill="none"/></svg>
      </button>
      <button class="tab focusable" data-tab="class" aria-label="Class" data-tip="<b>Class</b>Your class quest journey.">
        <svg viewBox="0 0 40 40" aria-hidden="true"><path d="M20 5 L32 10 V20 C32 28 26 33 20 36 C14 33 8 28 8 20 V10 Z" fill="#f58cba" stroke="#3a1424" stroke-width="2" stroke-linejoin="round"/><path d="M20 9 L28 12.5 V20 C28 26 24 29.5 20 32 C16 29.5 12 26 12 20 V12.5 Z" fill="#fff0d0" opacity=".25"/><path d="M14 13 L26 25 M26 13 L14 25" stroke="#2a1608" stroke-width="2"/><rect x="11" y="10" width="7" height="5" rx="1" transform="rotate(45 14.5 12.5)" fill="#e2bb4f" stroke="#4a3218"/><path d="M20 4 V9" stroke="#ffd24d" stroke-width="2"/></svg>
      </button>
      <span class="glyph shoulder">RB</span>
    </nav>

    <footer class="legendbox">
      <div class="info" id="info"></div>
      <div class="hints" id="hints"></div>
    </footer>

    <div class="pointer" id="pointer" hidden><svg viewBox="0 0 16 22" aria-hidden="true"><path d="M2 2 L14 11 L2 20 L5.5 11 Z" fill="#ffe600" stroke="#6b5200" stroke-width="1.2" stroke-linejoin="round"/></svg></div>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="toast" id="toast" hidden></div>
  </div>
  <button class="reopen" id="reopen" hidden>Reopen Azerfolio (/azf)</button>
  <div class="gamealert" id="gamealert" hidden></div>
</div>

<script src="data.js"></script>
<script src="explored.js"></script>
<script src="atlas-rects.js"></script>
<script src="zone-art/index.js" onerror="window.AZF_ART = null"></script>
<script src="app.js"></script>
</body>
</html>
